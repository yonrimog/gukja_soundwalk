<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202321">
  <title>국자와 주걱 사운드워크</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { color-scheme: light; --ink:#202321; --accent:#2586c8; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif; }
    #map { position:fixed; inset:0; background:#e9e6df; }
    .panel { position:fixed; z-index:1000; top:max(16px, env(safe-area-inset-top)); left:16px; right:16px; max-width:760px; margin:0 auto; padding:20px 22px 18px; border-radius:25px; color:#fff; background:rgba(32,35,33,.94); box-shadow:0 8px 28px #0003; }
    h1 { margin:0 0 7px; font-size:clamp(21px,4.8vw,30px); line-height:1.25; font-weight:750; }
    #message { margin:0 0 15px; color:#dedede; font-size:clamp(15px,3.8vw,20px); line-height:1.45; }
    .controls { display:flex; align-items:center; flex-wrap:wrap; gap:9px; }
    button { border:0; border-radius:17px; padding:13px 21px; min-height:52px; font:700 17px inherit; font-size:17px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    #gpsButton { color:#151515; background:#fff; }
    #pauseButton { color:#fff; background:#4b514d; }
    #gpsState { margin-left:auto; color:#c8d0cb; font-size:12px; }
    .now-playing { margin-top:12px; min-height:20px; color:#e9ecea; font-size:14px; }
    .leaflet-control-attribution { font-size:10px !important; }
    .point-label { background:rgba(32,35,33,.88); color:#fff; border:0; border-radius:10px; padding:7px 10px; font-size:14px; font-weight:700; box-shadow:0 2px 8px #0003; white-space:nowrap; }
    .point-label:before { display:none; }
    .point-number { width:30px; height:30px; border:3px solid #2586c8; border-radius:50%; background:#ffffffd9; color:#174e76; display:grid; place-items:center; font-size:14px; font-weight:800; box-shadow:0 1px 5px #0003; }
    .user-dot { width:18px; height:18px; border:3px solid white; border-radius:50%; background:#1687dc; box-shadow:0 0 0 5px #1687dc44,0 1px 5px #0005; }
    .leaflet-div-icon { background:transparent; border:0; }
    @media (max-width:520px) { .panel { padding:17px 18px 15px; border-radius:22px; } button { min-height:48px; padding:11px 17px; } #gpsState { width:100%; margin:0; } .point-label { font-size:12px; padding:6px 8px; } }
  </style>
</head>
<body>
  <div id="map" aria-label="국자와 주걱 사운드워크 지도"></div>
  <section class="panel" aria-label="사운드워크 제어판">
    <h1>국자와 주걱 사운드워크</h1>
    <p id="message">GPS 시작 버튼을 눌러 주세요.</p>
    <div class="controls">
      <button id="gpsButton">GPS 시작</button>
      <button id="pauseButton" disabled>음원 일시정지</button>
      <span id="gpsState">위치 서비스 대기 중</span>
    </div>
    <div class="now-playing" id="nowPlaying">재생할 음원을 준비하고 있습니다.</div>
  </section>
  <audio id="player" preload="auto"></audio>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    // 좌표는 사용자가 제공한 도·분·초(DMS)를 십진수 좌표로 변환했습니다.
    const points = [
      { n:1, name:'국자와 주걱', lat:37.653333, lng:126.445000, audio:'audio/1.mp3' },
      { n:2, name:'죽은 나무', lat:37.653056, lng:126.446111, audio:'audio/2.mp3' },
      { n:3, name:'흙집', lat:37.653333, lng:126.446944, audio:'audio/3.mp3' },
      { n:4, name:'흙집 다음 좌회전', lat:37.653056, lng:126.447222, audio:'audio/4.mp3' },
      { n:5, name:'사거리 좌회전', lat:37.654444, lng:126.446667, audio:'audio/5.mp3' },
      { n:6, name:'남천 사거리', lat:37.654167, lng:126.443333, audio:'audio/6.mp3' },
      { n:7, name:'마지막 사거리', lat:37.653056, lng:126.443333, audio:'audio/7.mp3' }
    ];
    const RADIUS_METERS = 20;
    const FADE_MS = 2000;
    const map = L.map('map', { zoomControl:true }).setView([37.6537,126.4452], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:20, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const bounds = [];
    points.forEach(p => {
      const marker = L.marker([p.lat,p.lng], { icon:L.divIcon({className:'', html:`<div class="point-number">${p.n}</div>`, iconSize:[30,30], iconAnchor:[15,15]}) }).addTo(map);
      marker.bindTooltip(`${p.n}. ${p.name}`, { permanent:true, direction:'right', offset:[9,0], className:'point-label' });
      L.circle([p.lat,p.lng], { radius:RADIUS_METERS, color:'#2586c8', weight:1, opacity:.35, fillColor:'#2586c8', fillOpacity:.045, interactive:false }).addTo(map);
      bounds.push([p.lat,p.lng]);
    });
    // 코스 전체가 처음 화면에 들어오도록 하되, 모바일에서는 제어판 아래 공간을 고려합니다.
    map.fitBounds(bounds, { paddingTopLeft:[28,190], paddingBottomRight:[28,35], maxZoom:17 });

    const player = document.getElementById('player');
    const gpsButton = document.getElementById('gpsButton');
    const pauseButton = document.getElementById('pauseButton');
    const message = document.getElementById('message');
    const gpsState = document.getElementById('gpsState');
    const nowPlaying = document.getElementById('nowPlaying');
    let watchId = null;
    let nextPointIndex = 0;
    let currentPoint = null;
    let isPaused = false;
    let isTransitioning = false;
    let userMarker = null;
    let userAccuracy = null;
    let lastPosition = null;

    function distanceMeters(aLat,aLng,bLat,bLng) {
      return map.distance([aLat,aLng],[bLat,bLng]);
    }
    function setMessage(text) { message.textContent = text; }
    function updatePauseButton() {
      pauseButton.disabled = !currentPoint;
      pauseButton.textContent = isPaused ? '음원 다시 재생' : '음원 일시정지';
    }
    async function playPoint(point) {
      if (isTransitioning) return;
      isTransitioning = true;
      const wasPaused = isPaused;
      if (currentPoint && !player.paused) {
        const startVolume = player.volume;
        const steps = 20;
        for (let i=steps-1; i>=0; i--) {
          player.volume = startVolume * i / steps;
          await new Promise(resolve => setTimeout(resolve, FADE_MS/steps));
        }
        player.pause();
      } else {
        player.pause();
      }
      player.src = point.audio;
      player.volume = 1;
      player.load();
      currentPoint = point;
      isPaused = wasPaused;
      nextPointIndex = point.n; // 다음 GPS 판정은 다음 번호 지점부터 진행
      nowPlaying.textContent = `${point.n}번 · ${point.name}`;
      setMessage(`${point.n}번 지점에 도착했습니다.`);
      updatePauseButton();
      if (!isPaused) {
        try { await player.play(); }
        catch (err) {
          isPaused = true;
          setMessage('음원 재생을 시작하려면 아래 버튼을 눌러 주세요.');
          pauseButton.disabled = false;
          pauseButton.textContent = '음원 재생';
        }
      }
      isTransitioning = false;
    }

    function onPosition(position) {
      const { latitude, longitude, accuracy } = position.coords;
      lastPosition = { lat:latitude, lng:longitude };
      gpsState.textContent = `GPS 정확도 약 ${Math.round(accuracy)}m`;
      if (!userMarker) {
        userMarker = L.marker([latitude,longitude], { icon:L.divIcon({className:'',html:'<div class="user-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]}), zIndexOffset:1000 }).addTo(map);
        userAccuracy = L.circle([latitude,longitude], { radius:accuracy, color:'#1687dc', weight:1, opacity:.35, fillOpacity:.06 }).addTo(map);
        map.setView([latitude,longitude], 18);
      } else {
        userMarker.setLatLng([latitude,longitude]);
        userAccuracy.setLatLng([latitude,longitude]);
        userAccuracy.setRadius(accuracy);
      }
      if (nextPointIndex >= points.length || isTransitioning) return;
      const target = points[nextPointIndex];
      const distance = distanceMeters(latitude,longitude,target.lat,target.lng);
      if (distance <= RADIUS_METERS) {
        // 지점은 순서대로 한 번만 통과 처리합니다. GPS가 반경 안에서 흔들려도 재시작하지 않습니다.
        playPoint(target);
      } else {
        setMessage(currentPoint ? `${currentPoint.n}번 재생 중 · 다음은 ${target.n}번 ${target.name}` : `1번 지점으로 이동해 주세요. (약 ${Math.round(distance)}m)`);
      }
    }
    function onGpsError(error) {
      const messages = { 1:'위치 권한이 거부되었습니다. 브라우저 설정에서 위치 접근을 허용해 주세요.', 2:'현재 위치를 확인할 수 없습니다.', 3:'GPS 응답 시간이 초과되었습니다.' };
      setMessage(messages[error.code] || 'GPS 오류가 발생했습니다.');
      gpsState.textContent = 'GPS 연결 오류';
    }
    gpsButton.addEventListener('click', () => {
      if (!navigator.geolocation) { setMessage('이 브라우저는 GPS 위치 기능을 지원하지 않습니다.'); return; }
      if (watchId !== null) return;
      gpsButton.disabled = true;
      gpsButton.textContent = 'GPS 실행 중';
      setMessage('현재 위치를 확인하고 있습니다.');
      watchId = navigator.geolocation.watchPosition(onPosition,onGpsError,{ enableHighAccuracy:true, maximumAge:1000, timeout:20000 });
    });
    pauseButton.addEventListener('click', async () => {
      if (!currentPoint) return;
      if (isPaused || player.paused) {
        isPaused = false;
        try { await player.play(); setMessage(`${currentPoint.n}번 음원을 재생합니다.`); }
        catch (err) { isPaused = true; setMessage('음원 파일을 확인해 주세요.'); }
      } else {
        player.pause();
        isPaused = true;
        setMessage('음원을 일시정지했습니다.');
      }
      updatePauseButton();
    });
    player.addEventListener('ended', () => {
      if (currentPoint) setMessage(`${currentPoint.n}번 음원이 끝났습니다. 다음 지점으로 이동해 주세요.`);
    });
    player.addEventListener('error', () => {
      if (currentPoint) setMessage(`${currentPoint.n}번 음원 파일을 찾을 수 없습니다. audio 폴더의 파일 이름을 확인해 주세요.`);
    });
  </script>
</body>
</html>
