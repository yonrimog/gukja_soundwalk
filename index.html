<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202321"><title>국자와주걱 사운드워크</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Noto Sans",sans-serif}#map{position:fixed;inset:0;background:#e9e6df}.panel{position:fixed;z-index:1000;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;max-width:760px;margin:auto;padding:20px 22px 18px;border-radius:25px;color:#fff;background:rgba(32,35,33,.94);box-shadow:0 8px 28px #0003}h1{margin:0 0 7px;font-size:clamp(21px,4.8vw,30px)}#message{margin:0 0 15px;color:#dedede;font-size:clamp(15px,3.8vw,20px);line-height:1.45}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:9px}button{border:0;border-radius:17px;padding:13px 21px;min-height:52px;font-size:17px;font-weight:700;cursor:pointer}button:disabled{opacity:.45}#gpsButton{color:#151515;background:white}#pauseButton{color:white;background:#4b514d}#gpsState{margin-left:auto;color:#c8d0cb;font-size:12px}.now-playing{margin-top:12px;min-height:20px;color:#e9ecea;font-size:14px}.point-label{background:rgba(32,35,33,.88);color:white;border:0;border-radius:10px;padding:7px 10px;font-size:14px;font-weight:700;white-space:nowrap}.point-label:before{display:none}.point-number{width:30px;height:30px;border:3px solid #2586c8;border-radius:50%;background:#ffffffd9;color:#174e76;display:grid;place-items:center;font-size:14px;font-weight:800}.user-dot{width:18px;height:18px;border:3px solid white;border-radius:50%;background:#1687dc;box-shadow:0 0 0 5px #1687dc44}@media(max-width:520px){.panel{padding:17px 18px 15px}button{min-height:48px;padding:11px 17px}#gpsState{width:100%;margin:0}.point-label{font-size:12px;padding:6px 8px}}</style></head><body><div id="map"></div><section class="panel"><h1>국자와주걱 사운드워크</h1><p id="message">GPS 시작 버튼을 눌러 주세요.</p><div class="controls"><button id="gpsButton">GPS 시작</button><button id="pauseButton" disabled>음원 일시정지</button><span id="gpsState">위치 서비스 대기 중</span></div><div class="now-playing" id="nowPlaying">재생할 음원을 준비하고 있습니다.</div></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const I18N={"title": "국자와주걱 사운드워크", "start": "GPS 시작", "pause": "음원 일시정지", "resume": "음원 다시 재생", "waiting": "위치 서비스 대기 중", "initial": "GPS 시작 버튼을 눌러 주세요.", "ready": "재생할 음원을 준비하고 있습니다.", "running": "GPS 실행 중", "finding": "현재 위치를 확인하고 있습니다.", "gps": "GPS 정확도 약 {x}m", "arrived": "{n}번 지점에 도착했습니다.", "next": "{n}번 재생 중 · 다음은 {t}번 {name}", "head": "1번 지점으로 이동해 주세요. (약 {d}m)", "finished": "{n}번 음원이 끝났습니다. 다음 지점으로 이동해 주세요.", "paused": "음원을 일시정지했습니다.", "unsupported": "이 브라우저는 GPS 위치 기능을 지원하지 않습니다.", "audiofail": "음원을 불러오지 못했습니다. 네트워크와 audio 폴더를 확인해 주세요.", "gpsfail": "GPS 오류가 발생했습니다. 위치 권한을 확인해 주세요.", "unlockfail": "오디오 시작이 차단되었습니다. 브라우저에서 소리 재생을 허용해 주세요."};
const points=[{"n": 1, "name": "국자와주걱", "lat": 37.653333, "lng": 126.445, "radius": 20, "audio": "audio/1.mp3"}, {"n": 2, "name": "죽은 나무", "lat": 37.653056, "lng": 126.446111, "radius": 20, "audio": "audio/2.mp3"}, {"n": 3, "name": "흙집", "lat": 37.653333, "lng": 126.446944, "radius": 18, "audio": "audio/3.mp3"}, {"n": 4, "name": "흙집 다음 좌회전", "lat": 37.653056, "lng": 126.447222, "radius": 18, "audio": "audio/4.mp3"}, {"n": 5, "name": "사거리 좌회전", "lat": 37.654444, "lng": 126.446667, "radius": 20, "audio": "audio/5.mp3"}, {"n": 6, "name": "남천 사거리", "lat": 37.654167, "lng": 126.443333, "radius": 20, "audio": "audio/6.mp3"}, {"n": 7, "name": "마지막 사거리", "lat": 37.653056, "lng": 126.443333, "radius": 20, "audio": "audio/7.mp3"}];
const map=L.map('map').setView([37.6537,126.4452],17);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
points.forEach(p=>{L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<div class="point-number">${p.n}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map).bindTooltip(`${p.n}. ${p.name}`,{permanent:true,direction:'right',offset:[9,0],className:'point-label'});L.circle([p.lat,p.lng],{radius:p.radius,color:'#2586c8',weight:1,opacity:.35,fillOpacity:.045,interactive:false}).addTo(map)});
map.fitBounds(points.map(p=>[p.lat,p.lng]),{paddingTopLeft:[28,190],paddingBottomRight:[28,35],maxZoom:17});
const gpsButton=document.getElementById('gpsButton'),pauseButton=document.getElementById('pauseButton'),message=document.getElementById('message'),gpsState=document.getElementById('gpsState'),nowPlaying=document.getElementById('nowPlaying');
const fmt=(s,o={})=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]??'');
let ctx=null,gain=null,source=null,watchId=null,nextIndex=0,current=null,paused=false,transitioning=false,lastPosition=null,userMarker=null,userAccuracy=null;
let startedAt=0,offset=0,buffer=null,ended=false,playToken=0;
const buffers=new Map();
function say(s){message.textContent=s}
function buttons(){pauseButton.disabled=!current;pauseButton.textContent=paused?I18N.resume:I18N.pause}
async function loadAudio(point){if(buffers.has(point.n))return buffers.get(point.n);const response=await fetch(point.audio);if(!response.ok)throw Error('HTTP '+response.status);const data=await response.arrayBuffer();const decoded=await ctx.decodeAudioData(data);buffers.set(point.n,decoded);return decoded}
function stopSource(){if(source){source.onended=null;try{source.stop()}catch(e){}source.disconnect();source=null}}
function startBuffer(){if(!buffer||!ctx||paused)return;stopSource();if(offset>=buffer.duration){offset=0}gain.gain.cancelScheduledValues(ctx.currentTime);gain.gain.value=1;const s=ctx.createBufferSource();s.buffer=buffer;s.connect(gain);source=s;startedAt=ctx.currentTime;s.onended=()=>{if(source!==s||paused)return;source=null;offset=buffer.duration;ended=true;say(fmt(I18N.finished,{n:current.n}));if(current.n===3)checkPosition()};s.start(0,offset);buttons()}
async function playPoint(point){if(transitioning||point.n!==nextIndex+1)return;transitioning=true;const token=++playToken;try{const incoming=await loadAudio(point);if(token!==playToken)return;if(source){const old=source;gain.gain.cancelScheduledValues(ctx.currentTime);gain.gain.setValueAtTime(gain.gain.value,ctx.currentTime);gain.gain.linearRampToValueAtTime(0,ctx.currentTime+2);await new Promise(r=>setTimeout(r,2000));if(source===old)stopSource()}else stopSource();buffer=incoming;offset=0;ended=false;current=point;nextIndex=point.n;nowPlaying.textContent=`${point.n} · ${point.name}`;say(fmt(I18N.arrived,{n:point.n}));buttons();if(!paused){await ctx.resume();startBuffer()}if(point.n===3&&lastPosition)checkPosition()}catch(e){console.error(e);say(I18N.audiofail)}finally{transitioning=false}}
function checkPosition(){if(!lastPosition||transitioning||nextIndex>=points.length)return;const p=points[nextIndex],d=map.distance([lastPosition.lat,lastPosition.lng],[p.lat,p.lng]);if(d<=p.radius){if(p.n===4&&current?.n===3&&!ended)return;playPoint(p)}else if(!ended)say(current?fmt(I18N.next,{n:current.n,t:p.n,name:p.name}):fmt(I18N.head,{d:Math.round(d)}))}
function onPosition(position){const {latitude,longitude,accuracy}=position.coords;lastPosition={lat:latitude,lng:longitude};gpsState.textContent=fmt(I18N.gps,{x:Math.round(accuracy)});if(!userMarker){userMarker=L.marker([latitude,longitude],{icon:L.divIcon({className:'',html:'<div class="user-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map);userAccuracy=L.circle([latitude,longitude],{radius:accuracy,color:'#1687dc',weight:1,opacity:.35,fillOpacity:.06}).addTo(map);map.setView([latitude,longitude],18)}else{userMarker.setLatLng([latitude,longitude]);userAccuracy.setLatLng([latitude,longitude]);userAccuracy.setRadius(accuracy)}checkPosition()}
gpsButton.addEventListener('click',()=>{if(!navigator.geolocation){say(I18N.unsupported);return}if(watchId!==null)return;try{const AudioContextClass=window.AudioContext||window.webkitAudioContext;ctx=new AudioContextClass();gain=ctx.createGain();gain.connect(ctx.destination);ctx.resume().catch(()=>say(I18N.unlockfail))}catch(e){say(I18N.unlockfail);return}gpsButton.disabled=true;gpsButton.textContent=I18N.running;say(I18N.finding);watchId=navigator.geolocation.watchPosition(onPosition,()=>{say(I18N.gpsfail);gpsState.textContent=I18N.gpsfail},{enableHighAccuracy:true,maximumAge:1000,timeout:20000})});
pauseButton.addEventListener('click',async()=>{if(!current)return;if(paused){paused=false;try{await ctx.resume();startBuffer();say(fmt(I18N.arrived,{n:current.n}))}catch(e){paused=true;say(I18N.unlockfail)}}else{if(source){offset=Math.min(buffer.duration,offset+ctx.currentTime-startedAt);stopSource()}paused=true;say(I18N.paused)}buttons()});
</script></body></html>
